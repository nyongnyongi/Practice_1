<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset = "UTF-8">
    <meta http-equiv = "X-UA-Compatilble" content = "IE=edge">
    <meta name = "viewport" content = "width=device-width, initial-scale=1.0">
    <title>구글</title>

    <style>
        h1 {
            text-align: center;
            margin-top: 190px;
            color: #4285F4;
            font-family: Roboto;
            font-size: 90px;
            font-style: normal;
            font-weight: 400;
            line-height: normal;
            letter-spacing: -12px;

        }

        h1 span:nth-child(1) {
            color: #4285F4;
        }

        h1 span:nth-child(2) {
            color: #EA4335;
        }

        h1 span:nth-child(3) {
            color: #FCC629;
        } 

        h1 span:nth-child(4) {
            color: #4285F4;
        }

        h1 span:nth-child(5) {
            color: #34A853;
        }

        h1 span:nth-child(6) {
            color: #EA4335;
        }

        input {
            display: block;
            margin: -30px auto 0;
            width: 616px;
            height: 46px;
            border-radius: 24px;
            border: 1px solid #DFE1E5;
            background: #FFF;
        }

        .button-box {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 26px;
        }
        
        .button-box button:nth-child(1) {
            width: 111px;
            height: 36px;
            border-radius: 4px;
            border: 1px solid #F8F9FA;
            background: #F8F9FA;
        }

        .button-box button:nth-child(2) {
            width: 143px;
            height: 36px;
            border-radius: 4px;
            border: 1px solid #F8F9FA;
            background: #F8F9FA;
        }

    </style>

</head>

<body>
    <h1>
        <span>J</span>
        <span>o</span>
        <span>o</span>
        <span>g</span>
        <span>l</span>
        <span>e</span>
    </h1>

    <input type= "text">
    <div class = "button-box">
        <button>Google 검색</button>
        <button>I'm feeling lucky</button>
    </div>

</body>

</html>
